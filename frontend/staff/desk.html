<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Desk - City General Hospital</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 15px;
    }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th {
      background-color: var(--bg);
      font-weight: 600;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header class="top-bar">
    <a href="#" class="brand">
      <svg class="brand-cross" viewBox="0 0 24 24"><path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z" fill="currentColor"/></svg>
      <span>Front Desk - City General Hospital</span>
    </a>
    <a href="dashboard.html" class="btn btn-secondary btn-sm">Department Dashboard &rarr;</a>
  </header>

  <main class="container" style="display: flex; flex-direction: column; gap: 24px; padding-top: 24px;">

    <!-- Doctors Status & Overrides Section -->
    <section class="card">
      <div class="flex-between">
        <h2>Today's Doctors & Status Overrides</h2>
        <span class="text-muted">Instant live updates</span>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Doctor Name</th>
              <th>Department</th>
              <th>Base Room</th>
              <th>Today's Status</th>
              <th>Room Node Override</th>
              <th>Status Note</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="staff-doctors-tbody">
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- Visit & Patient Actions Section -->
    <section class="card">
      <h2>Visit Management & Actions</h2>
      
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 12px;">
        
        <div class="form-group">
          <label class="form-label">Target Visit ID (e.g. 1)</label>
          <input type="number" id="action-visit-id" class="form-input" placeholder="Visit ID (e.g. 1)" value="1">
        </div>

        <div class="form-group">
          <label class="form-label">Assign Doctor</label>
          <select id="action-doctor-id" class="form-select">
            <option value="1">Dr. Rajesh Sharma (General Medicine)</option>
            <option value="2">Dr. Meera Iyer (Cardiology)</option>
            <option value="3">Dr. Ananya Verma (Orthopaedics)</option>
            <option value="4">Dr. Vikram Patel (Paediatrics)</option>
          </select>
          <button id="btn-assign-doc" class="btn btn-secondary btn-sm" style="margin-top: 6px;">Assign Doctor</button>
        </div>

        <div class="form-group">
          <label class="form-label">Append Visit Task</label>
          <select id="action-task-kind" class="form-select">
            <option value="consultation">Consultation</option>
            <option value="diagnostics">Diagnostics / Lab</option>
            <option value="pharmacy">Pharmacy</option>
            <option value="billing">Billing</option>
            <option value="discharge">Discharge</option>
          </select>
          <button id="btn-add-task" class="btn btn-primary btn-sm" style="margin-top: 6px;">Add Next Task</button>
        </div>

        <div class="form-group" style="justify-content: flex-end;">
          <label class="form-label">Discharge Visit</label>
          <button id="btn-close-visit" class="btn btn-danger btn-sm" style="margin-top: 6px;">Close & Discharge Visit</button>
        </div>

      </div>
    </section>

  </main>

  <script type="module">
    import { loadFrontDesk } from './staff.js';
    document.addEventListener("DOMContentLoaded", loadFrontDesk);
  </script>
</body>
</html>
