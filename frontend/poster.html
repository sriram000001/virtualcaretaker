<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrance Guide Poster - City General Hospital</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background-color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
    }

    .poster-container {
      max-width: 600px;
      width: 100%;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background-color: #FFFFFF;
    }

    .poster-qr {
      width: 260px;
      height: 260px;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
    }

    .url-badge {
      font-family: monospace;
      font-size: 20px;
      font-weight: 600;
      color: var(--primary);
      background-color: var(--primary-weak);
      padding: 8px 16px;
      border-radius: 6px;
    }

    @media print {
      body {
        padding: 0;
      }
      .poster-container {
        border: none;
        width: 100%;
        height: 100vh;
        justify-content: center;
      }
      .no-print {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <div class="poster-container">
    <div style="display: flex; align-items: center; gap: 12px;">
      <svg class="brand-cross" viewBox="0 0 24 24" style="width: 36px; height: 36px; color: var(--primary);">
        <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z" fill="currentColor"/>
      </svg>
      <h1 style="font-size: 28px;">City General Hospital</h1>
    </div>

    <h2 style="font-size: 22px; color: var(--muted); font-weight: 500;">Welcome! Scan to start your digital patient journey</h2>

    <img src="/api/qr.svg" alt="Scan QR Code" class="poster-qr">

    <div class="url-badge">http://localhost:8000</div>

    <p style="font-size: 16px; color: var(--muted); max-width: 440px;">
      Scan this QR code with your mobile camera for step-by-step 3D guidance, queue status, and room directions.
    </p>

    <button onclick="window.print()" class="btn btn-primary no-print" style="margin-top: 16px;">
      Print A4 Poster
    </button>
  </div>

</body>
</html>
