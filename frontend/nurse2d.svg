<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B8D4" />
      <stop offset="100%" stop-color="#006064" />
    </linearGradient>
  </defs>

  <g id="futuristic-ai-doll">
    <!-- Floating Aura Base Ring -->
    <ellipse cx="100" cy="225" rx="55" ry="8" fill="none" stroke="#00E5FF" stroke-width="2" filter="url(#neon-glow)"/>
    <ellipse cx="100" cy="225" rx="35" ry="5" fill="#00E5FF" opacity="0.3"/>

    <!-- Futuristic Cyber Body -->
    <path d="M 55 160 C 55 120 145 120 145 160 L 135 215 L 65 215 Z" fill="url(#cyber-body)" stroke="#00E5FF" stroke-width="1.5"/>
    
    <!-- Chest Glowing Emblem -->
    <rect x="97" y="145" width="6" height="20" fill="#00FFCC" filter="url(#neon-glow)"/>
    <rect x="90" y="152" width="20" height="6" fill="#00FFCC" filter="url(#neon-glow)"/>

    <!-- Neck Tech Ring -->
    <rect x="88" y="115" width="24" height="12" rx="4" fill="#0F2A3D" stroke="#00E5FF" stroke-width="1.5"/>

    <!-- Metallic Head -->
    <circle cx="100" cy="90" r="30" fill="#E0F7FA" stroke="#00E5FF" stroke-width="1.5"/>

    <!-- Cyber Hair / Headpiece -->
    <path d="M 70 85 C 70 55 130 55 130 85 C 120 68 80 68 70 85 Z" fill="#004D40"/>

    <!-- Glowing Sci-Fi Visor -->
    <rect x="74" y="82" width="52" height="14" rx="4" fill="#00E5FF" filter="url(#neon-glow)"/>
    <circle cx="88" cy="89" r="3" fill="#00FFCC"/>
    <circle cx="112" cy="89" r="3" fill="#00FFCC"/>

    <!-- Smile Line -->
    <path d="M 94 105 Q 100 110 106 105" fill="none" stroke="#00FFCC" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
